<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interview Prep BD — Bilingual Tech Interview Platform</title>
  <meta name="description" content="Bilingual (English + বাংলা) technical interview preparation for developers in Bangladesh and international roles: 18 technologies, practice sessions, MCQs, scoring and progress tracking.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0B1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238B7CFF'/%3E%3Cpath d='M20 22l-8 10 8 10M44 22l8 10-8 10M36 18l-8 28' stroke='%230B1020' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="sidebar__brand">
        <a href="#/dashboard" class="brand" aria-label="Interview Prep BD — dashboard">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="brand__text">
            <strong>Interview Prep BD</strong>
            <small>EN · বাংলা</small>
          </span>
        </a>
        <button class="icon-btn sidebar__collapse" id="collapseBtn" type="button" aria-label="Collapse sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <nav class="sidebar__nav" id="nav"></nav>
      <div class="sidebar__techs" id="sidebarTechs"></div>
      <div class="sidebar__foot" id="sidebarFoot"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main-wrap">
      <header class="topbar" id="topbar">
        <button class="icon-btn topbar__menu" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar__title" id="pageTitle" aria-live="polite"></div>
        <div class="topbar__actions" id="topbarActions"></div>
      </header>
      <main id="main" class="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">This application needs JavaScript enabled to run. / এই application চালাতে JavaScript চালু থাকতে হবে।</div>
  </noscript>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
